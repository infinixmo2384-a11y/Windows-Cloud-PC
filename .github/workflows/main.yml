
name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Windows
        shell: pwsh
        run: |
          Write-Host "Windows Cloud PC"
          Write-Host "System Information:"
          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion,
              OsArchitecture

          Write-Host "Cloud PC is running!"
